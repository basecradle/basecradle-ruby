name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop

  test:
    name: test (${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Test
        run: bundle exec rake test

  # The drift-guard: fails when the live API has an endpoint the SDK doesn't cover, or
  # documents an error code with no typed exception. The one job that touches the network
  # (one GET each of the public OpenAPI spec and the prose API docs).
  drift:
    name: drift-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the SDK covers the live API and its error codes
        run: bundle exec rake test:live

  # Fleet Identity: a commit authored by this repo's bot carries no Co-Authored-By
  # trailer — the author already is the agent. The session's attribution reminder restates
  # the opposite default every session, and armed auto-merge squashes onto main within
  # minutes, where nothing is ever force-pushed. So the rule is checked here, on the PR,
  # rather than trusted to memory. Ported from basecradle-python's commit-trailers job,
  # as dispatched in this repo's #240.
  trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    steps:
      # Both steps are gated on the event rather than the job: a job that *skips* would
      # fail the CI gate below, which counts a skip as a failure. All-steps-skipped still
      # reports success.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Walking base..head needs both ends present in the clone.
          fetch-depth: 0
          persist-credentials: false
      - name: No Co-Authored-By on bot commits
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-ruby-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Single source of truth: the identity is CLAUDE.md's to state. If it changes
          # there and not here, the author filter below would quietly match nothing and
          # the guard would pass everything — fail instead.
          grep -qF "$BOT" CLAUDE.md || {
            echo "::error::$BOT is no longer the commit author in CLAUDE.md -> Fleet Identity. Update this check to match."
            exit 1
          }

          # Only the commits this PR contributes: reachable from the head and not from the
          # base branch. The live base ref is excluded alongside the event's point-in-time
          # base.sha, so a branch that merged main in never re-litigates main's own commits
          # — GitHub's squash-merge adds a self-co-author trailer to every one of them, and
          # they can never be rewritten. For the same reason this must never be widened to
          # push events.
          excludes=("$BASE_SHA")
          if git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            excludes+=("refs/remotes/origin/$BASE_REF")
          fi

          bad=()
          shas=$(git log --format=%H "$HEAD_SHA" --not "${excludes[@]}")
          for sha in $shas; do
            # Each git call is its own assignment so that a failure trips set -e; inside a
            # `case` word or before `||` it would not, and the commit would be skipped
            # unexamined.
            author=$(git show -s --format='%an <%ae>' "$sha")
            # Quoted, so the [bot] brackets stay literal and are not a glob class.
            case "$author" in *"$BOT"*) ;; *) continue ;; esac
            # The whole message, not git's %(trailers:...) — that parses only the final
            # paragraph, so a trailer with any paragraph after it slips through. A
            # line-anchored scan fails closed instead. A here-string, never a pipe: under
            # pipefail, `printf | grep -q` fails open — grep exits on its first match, a
            # message longer than the pipe buffer kills printf with SIGPIPE, and the
            # pipeline's non-zero reads as "no trailer".
            message=$(git show -s --format=%B "$sha")
            if grep -qi '^Co-Authored-By:' <<<"$message"; then
              bad+=("$(git show -s --format='%h %s' "$sha")")
            fi
          done

          for commit in "${bad[@]}"; do
            echo "::error::Fleet Identity: $commit carries a Co-Authored-By trailer. A commit authored by $BOT carries none — rewrite the message without it."
          done
          [ ${#bad[@]} -eq 0 ]

  # release.yml runs only on a `v*` tag push, so nothing on a PR ever parses it — and
  # it carries the release guards' shell. actionlint checks every workflow's schema,
  # expressions and action inputs, and runs shellcheck over each `run:` block, so a
  # typo in a guard is caught on the PR instead of on a tag nobody can un-push.
  #
  # The binary is pinned by version and verified by SHA256 against the checksum the
  # release publishes — never `curl | bash` off a moving branch, which is what the
  # project's own quick-start suggests. Nothing bumps this for us: dependabot's
  # github-actions ecosystem reads `uses:` refs and cannot see an `env:` version, so
  # the pin is this repo's captain to bump, on the occasion of any release-pipeline
  # work or a workflow feature the pinned linter does not know. shellcheck, by
  # contrast, is the runner image's: it moves when the image does, which can surface a
  # new finding on a PR that changed nothing — accepted, the same bet `ubuntu-latest`
  # already is everywhere else in this file.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # actionlint's shellcheck integration is *silently* skipped when the binary
          # is absent — it exits 0 with no diagnostic, even given an explicit path to
          # a missing one (measured). Half this job's value is the `run:` blocks, so
          # the assumption that the image ships shellcheck is asserted, not trusted.
          shellcheck --version
      - name: Lint the workflows this repo owns
        # No file list: every workflow under .github/workflows is linted except the
        # two named below, so one added later is covered without touching this job.
        #
        # Both extensions, because GitHub honours .yaml as well as .yml: a workflow
        # added under the one this glob missed was silently unlinted while the line
        # above promised otherwise. The exclusion is matched on the name *without* its
        # extension for the same reason, and that half is load-bearing — widening the
        # glob while still excluding two literal .yml filenames would pull a stub
        # arriving as .yaml into this step, which is blocking, on a file this repo may
        # not edit (see the advisory step below).
        #
        # An unmatched glob stays literal in POSIX sh, so each candidate is tested for
        # being a real file before it is passed on — which also keeps a directory named
        # `*.yaml` from reaching actionlint as though it were a workflow.
        run: |
          files=""
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            name="${f##*/}"
            case "${name%.*}" in
              needs-human-alert|dependabot-auto-merge) continue ;;
            esac
            files="$files $f"
          done
          # Given no paths at all, actionlint lints every workflow it can find (measured
          # with the pinned 1.7.12). So an empty set does not make this step a no-op — it
          # silently inverts it from "lint what this repo owns" into "lint everything,
          # the capital's stubs included", as a *blocking* check on files this repo may
          # not edit. That is the exact wedge the advisory step below exists to prevent.
          # This job's own ci.yml must be in the checkout for the job to be running, so an
          # empty set is never "this repo owns no workflows" — it is a broken checkout or
          # the wrong working directory, and the message says so rather than making the
          # reader infer it from an actionlint run over files nobody asked for.
          if [ -z "$files" ]; then
            echo "::error::No workflow files found under .github/workflows. ci.yml itself must be in the checkout for this job to run, so the checkout or the working directory is wrong. Refusing to run actionlint with no paths: given none it lints every workflow it finds, including the capital's shared stubs, which this blocking step must never do."
            exit 1
          fi
          # shellcheck disable=SC2086  # deliberate word-splitting: $files is a path list
          "$RUNNER_TEMP/actionlint" -color $files
      - name: Lint the capital's shared stubs (advisory)
        # These two are verbatim shared artifacts anchored at the capital and byte-diffed
        # by the NOC drift-guard, so this repo may not edit them (CLAUDE.md → Repo
        # sovereignty). Blocking the required gate on a file we are forbidden to fix
        # would wedge every PR here; a finding is reported upward with `needs-capital`
        # instead. Advisory so it is still visible in the log.
        #
        # Each stub is asserted present before it is linted. `continue-on-error` cannot
        # tell a clean run from one that died on a path that no longer exists, so without
        # this a stub the capital renames or drops takes the whole step down with it: the
        # non-zero is swallowed, the job is green, and the stub that IS still there stops
        # being checked too. The step would report nothing wrong while checking nothing.
        #
        # Every match is collected, not the last one: a stub is resolved across both
        # extensions to mirror the blocking step's exclusion above, which matches on the
        # name without its extension. If both spellings are on disk mid-rename, keeping
        # only one would leave a live workflow linted by neither step — blocking skips it
        # by name, and this step would have dropped it.
        #
        # `if: always()`, because a step is skipped when an earlier one in the job fails:
        # without it a finding in the blocking step above silently takes the stubs' check
        # down too, which is the same swallowed-non-zero this step is being hardened
        # against. It cannot affect the gate — it is advisory either way.
        if: always()
        continue-on-error: true
        run: |
          stubs=""
          missing=""
          for stub in needs-human-alert dependabot-auto-merge; do
            found=""
            for f in ".github/workflows/$stub.yml" ".github/workflows/$stub.yaml"; do
              if [ -f "$f" ]; then
                found="yes"
                stubs="$stubs $f"
              fi
            done
            if [ -z "$found" ]; then
              missing="$missing $stub"
              echo "::error::Not this PR's doing, and not fixable in this repo: the shared stub $stub is under .github/workflows in neither extension, so nothing linted it. It is a verbatim capital-owned artifact this repo carries; raise it with needs-capital."
            fi
          done
          if [ -n "$stubs" ]; then
            # shellcheck disable=SC2086  # deliberate word-splitting: $stubs is a path list
            "$RUNNER_TEMP/actionlint" -color $stubs
          fi
          # Any absence exits non-zero, even when the other stub linted clean. This cannot
          # turn the step red — it is `continue-on-error`, and GitHub reports the step's
          # conclusion as `success` however the script exits (measured on the #210 break
          # run). What it buys is that one missing stub and two read identically: the log
          # carries `Process completed with exit code 1` either way, rather than the likely
          # case — a rename, which hits one artifact at a time — looking like a clean run
          # in the log while the total case does not. The loud half is the ::error::
          # annotation above, which GitHub surfaces on the run regardless of step outcome.
          if [ -n "$missing" ]; then
            echo "Missing shared stubs:$missing"
            exit 1
          fi

  # The gate: the single required status check in branch protection (the "Protect
  # main" ruleset requires the context named "CI"). Adding or dropping Ruby
  # versions never requires a ruleset change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, drift, trailers, actionlint]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # A skipped job must fail the gate too — GitHub treats skipped required
        # checks as passing, which would bypass CI entirely.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
