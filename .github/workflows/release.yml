# The release pipeline: tag → rehearse → gate → publish. The gate is the capital's to
# actuate, never @origin's — see the publish job below.
#
# Zero stored credentials: RubyGems trusts this workflow via OIDC (Trusted
# Publishing). The workflow filename (release.yml) and the environment name
# (rubygems) are contractual — they match the trusted publisher registered on
# RubyGems; renaming either breaks the trust relationship and the publish 403s.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # RubyGems has no TestPyPI analogue, so the "rehearsal" is building the gem and
  # proving it installs and loads cleanly — on the 3.2 floor — before the gated push.
  rehearsal:
    continue-on-error: true
    name: rehearsal (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Deriving the release tag from the gemspec (#186) bought correctness at a price:
      # the version guard further down reads the same source the tag now comes from, so
      # the two agree *by construction*. A tag pushed onto a commit that is not main's
      # tip therefore sails through it — the stale tree builds the version the stale
      # tree names — and an immutable RubyGems version publishes from the wrong commit.
      # This is the independent check that loss cost us (#188), in CI rather than in an
      # operator's memory.
      #
      # First in the job on purpose: it needs only git and the tag name, so it rejects a
      # bad tag in a second rather than after setup-ruby and gem build — and every
      # second before it runs is another second in which an unattended Dependabot
      # auto-merge can move main under a correct tag (the check is at run time, not at
      # push time; that race is small but real, and its remedy is the skill's).
      #
      # Exact tip, not "an ancestor of main". Two consequences, both accepted when this
      # was ordered: a merge landing between the bump and the tag fails the run, and a
      # backport release from a maintenance branch cannot pass at all. Both are cheap
      # next to publishing the wrong tree, which cannot be undone.
      #
      # Fails closed: `set -e` is on by default, so an unreachable origin fails the run
      # rather than skipping the check. The fetch is unauthenticated — checkout runs
      # with persist-credentials: false — which works because this repo is public; were
      # it ever made private, this step would fail every release until it is given a
      # token. The tag name is read from the environment, never interpolated into the
      # script: it is attacker-supplied.
      - name: The tag must sit on main's tip
        run: |
          git fetch --depth=1 origin main
          tagged="$(git rev-parse HEAD)"
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tagged" != "$tip" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on $tagged, not main's tip $tip. Nothing was published. Do not just move the tag — see .claude/skills/rubygems-release, 'When a rehearsal guard fails'."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main's tip ($tagged)."
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build the gem
        run: gem build basecradle.gemspec
      # Nothing derives the *version* from the tag: `gem build` above, and `rake
      # release` in the publish job, both take it from lib/basecradle/version.rb via
      # the gemspec — and the tag is a separate artifact, derived from that same file
      # by the documented procedure (.claude/skills/rubygems-release) but still
      # hand-editable, and pushed by the capital in a separate turn from the captain
      # who bumped it. A mismatch cannot publish the wrong version (bundler derives
      # its own version_tag from the gemspec, so `rake release` dies at its SCM push
      # or at RubyGems' re-push rejection), but it dies *after* the rehearsal is
      # green and the capital has approved the rubygems gate, naming neither the tag
      # nor the mismatch. Failing here costs a deleted tag and a re-tag instead. The
      # version compared is the one on the gem just built, which is also bundler's
      # version_tag ("v" + Gem::Version#to_s, which normalizes 1.0.0-rc1 to
      # 1.0.0.pre.rc1) — so passing this step is precisely the precondition `rake
      # release` needs. The tag is read from the environment, never interpolated
      # into the script: a tag name is attacker-supplied.
      #
      # It also refuses a version that is not a plain X.Y.Z. Both guards above compare
      # the tag against the tree and each other; nothing asks whether the version they
      # agree on is one we meant to publish. A tag derived (#186) at the wrong moment —
      # before the release bump lands, or from a tree carrying a prerelease literal —
      # publishes that version, and a RubyGems version can never be replaced. This SDK
      # has only ever shipped final releases; the day a prerelease is planned, this
      # regex is widened deliberately in the PR that plans it (#192).
      - name: The tag must name a publishable version of this tree
        run: |
          gem_file="$(ls basecradle-*.gem)"
          built="${gem_file#basecradle-}"
          built="${built%.gem}"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not name the version this tree builds ($built). Re-tag as v$built, or bump lib/basecradle/version.rb to $tagged — then push again."
            exit 1
          fi
          if [[ ! "$built" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $built is not a plain X.Y.Z, so nothing will be published. This SDK ships final releases only — Gem::Version normalizes a 1.0.0-rc1 literal in lib/basecradle/version.rb to 1.0.0.pre.rc1, which is refused here on purpose. Delete the tag and fix the version, or widen this check in the PR that deliberately plans a prerelease."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the built gem $gem_file, and names a final release."
      - name: Install into a clean environment and verify it loads
        run: |
          gem install ./basecradle-*.gem
          ruby -e 'require "basecradle"; abort "bad version: #{BaseCradle::VERSION.inspect}" unless Gem::Version.correct?(BaseCradle::VERSION); puts "basecradle #{BaseCradle::VERSION} installs and loads cleanly"'

  # The real publish, behind the one manual gate in this repo — a second one is a
  # regression. The `rubygems` environment holds the run until its gate is actuated, and
  # that actuation belongs to the *capital*, via the capital's operator credential; it is
  # not @origin's, so a waiting run here is never a wait on a human (CLAUDE.md ->
  # Releasing carries the rule and names the current reviewer identity; the
  # `rubygems-release` skill carries the procedure). rubygems/release-gem builds and
  # pushes via OIDC; no API key is ever stored.
  publish:
    name: publish to RubyGems
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: rubygems-publish
      url: https://rubygems.org/gems/basecradle
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
