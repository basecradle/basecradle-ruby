# The release pipeline: tag → rehearse → human approval → publish.
#
# Zero stored credentials: RubyGems trusts this workflow via OIDC (Trusted
# Publishing). The workflow filename (release.yml) and the environment name
# (rubygems) are contractual — they match the trusted publisher registered on
# RubyGems; renaming either breaks the trust relationship and the publish 403s.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # RubyGems has no TestPyPI analogue, so the "rehearsal" is building the gem and
  # proving it installs and loads cleanly — on the 3.2 floor — before the gated push.
  rehearsal:
    name: rehearsal (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build the gem
        run: gem build basecradle.gemspec
      # Nothing before the gate reads the tag: `gem build` here, and `rake release`
      # in the publish job, both take the version from lib/basecradle/version.rb via
      # the gemspec — and the tag is hand-typed by the capital in a separate turn
      # from the captain who bumped that file. A mismatch cannot publish the wrong
      # version (bundler derives its own version_tag from the gemspec, so `rake
      # release` dies at its SCM push or at RubyGems' re-push rejection), but it dies
      # *after* the rehearsal is green and the capital has approved the rubygems
      # gate, naming neither the tag nor the mismatch. Failing here costs a deleted
      # tag and a retype instead. The version compared is the one on the gem just
      # built, which is also bundler's version_tag ("v" + Gem::Version#to_s, which
      # normalizes 1.0.0-rc1 to 1.0.0.pre.rc1) — so passing this step is precisely
      # the precondition `rake release` needs. The tag is read from the environment,
      # never interpolated into the script: a tag name is attacker-supplied.
      - name: The tag must name the version being built
        run: |
          gem_file="$(ls basecradle-*.gem)"
          built="${gem_file#basecradle-}"
          built="${built%.gem}"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not name the version this tree builds ($built). Re-tag as v$built, or bump lib/basecradle/version.rb to $tagged — then push again."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the built gem $gem_file."
      - name: Install into a clean environment and verify it loads
        run: |
          gem install ./basecradle-*.gem
          ruby -e 'require "basecradle"; abort "bad version: #{BaseCradle::VERSION.inspect}" unless Gem::Version.correct?(BaseCradle::VERSION); puts "basecradle #{BaseCradle::VERSION} installs and loads cleanly"'

  # The real publish. The rubygems environment requires the project owner's approval
  # (Drawk) — the one correct manual gate in this repo. rubygems/release-gem builds
  # and pushes via OIDC; no API key is ever stored.
  publish:
    name: publish to RubyGems
    runs-on: ubuntu-latest
    needs: rehearsal
    environment:
      name: rubygems
      url: https://rubygems.org/gems/basecradle
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
